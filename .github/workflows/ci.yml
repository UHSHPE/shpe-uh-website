name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-dummy-secret-not-used-in-production
      TEST_DATABASE_URL: postgresql+psycopg://shpe:shpe_dev_password@localhost:5433/shpe_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shpe
          POSTGRES_PASSWORD: shpe_dev_password
          POSTGRES_DB: shpe_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # requirements-dev.txt pulls in requirements.txt via -r
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build